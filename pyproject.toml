[project]
name = "isekai-realms"
version = "0.2.0"
description = "A voxel isekai world bound by the laws of a god who cannot touch it"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
isekai-realms = "isekai.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["isekai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
