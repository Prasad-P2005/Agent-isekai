<!doctype html>
<!-- The changelog email, dressed as the game's book: a leather cover around peach paper, in the interface's palette.
     Filled in by tools/make_changelog.py. Email clients ignore most CSS, so this is tables and inline styles on purpose.
     Most of them drop web fonts too, so the title is an image set in the game's own fonts (emails/title.png), sent inline as cid:title. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#2e2d3f">
<div style="display:none;max-height:0;overflow:hidden;color:#2e2d3f">{{summary}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2e2d3f" style="background:#2e2d3f">
<tr><td align="center" style="padding:24px 8px">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#7a3f33" style="width:600px;max-width:100%;background:#7a3f33;border:4px solid #3f2029">
    <tr><td style="padding:0 6px"><img src="cid:title" width="580" alt="Isekai Realms changelog" style="display:block;width:580px;max-width:100%;height:auto;border:0;color:#fac13c;font:bold 32px Georgia,serif"></td></tr>
    <tr><td style="padding:0 10px 10px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7caa0" style="background:#f7caa0;border:3px solid #3f2029">
        <tr><td style="padding:20px 22px 6px;border-top:3px solid #fde0c2;font:17px/1.5 Georgia,'Times New Roman',serif;color:#3f2029">
          <span style="display:inline-block;padding:3px 10px;background:#45445a;color:#fff1df;font:bold 13px Verdana,sans-serif;border:2px solid #2e2d3f">{{date}}</span>
          <span style="display:inline-block;padding:3px 10px;background:#fac13c;color:#3f2029;font:bold 13px Verdana,sans-serif;border:2px solid #3f2029">{{build}}</span>
          <p style="margin:14px 0 4px">{{summary}}</p>
        </td></tr>
<!--section-->
        <tr><td style="padding:14px 22px 2px">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="{{color}}" style="padding:4px 14px;background:{{color}};border:2px solid #3f2029;font:bold 14px Verdana,sans-serif;color:{{ink}};letter-spacing:1px">{{label}}</td></tr></table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:8px">
<!--item-->
            <tr><td width="18" valign="top" style="padding:3px 0;font:15px/1.5 Georgia,serif;color:#a8432f">&#9632;</td><td style="padding:3px 0;font:16px/1.5 Georgia,'Times New Roman',serif;color:#3f2029"><b>{{head}}</b> {{text}}</td></tr>
<!--/item-->
          </table>
        </td></tr>
<!--/section-->
<!--picture-->
        <tr><td style="padding:16px 22px 0">
          <a href="{{link}}" style="text-decoration:none"><img src="{{image}}" width="524" alt="{{caption}}" style="display:block;width:100%;max-width:524px;height:auto;border:3px solid #3f2029"></a>
          <div style="padding:6px 2px 0;font:italic 14px/1.4 Georgia,serif;color:#7a4a38">{{caption}}</div>
        </td></tr>
<!--/picture-->
        <tr><td style="padding:18px 22px 20px"></td></tr>
      </table>
    </td></tr>
    <tr><td align="center" style="padding:2px 12px 14px;font:13px/1.5 Verdana,sans-serif;color:#f7caa0">
      <a href="{{repo}}" style="color:#fac13c">See the code on GitHub</a><br>Sent from a no-reply address, so replies are not read.
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
