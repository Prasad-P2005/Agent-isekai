<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isekai Realms</title>
<link rel="preload" href="vendor/fonts/jersey-10.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/jacquard-24.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/ui/favicon.png">
</head>
<body>
<div id="overlay"><div class="book" id="titlebook"><div class="spread">
  <section class="page left">
    <h1>Isekai Realms</h1>
    <p id="lede">You died on Earth. A god is waiting for you in the heavens.</p>
    <div id="moves"></div>
  </section>
  <section class="page right">
    <div id="menu"><p class="go">Connecting to the server…</p></div>
    <div id="controls"></div>
  </section>
  <i class="clasp"></i>
</div></div>
  <div id="pausecard" role="dialog" aria-labelledby="pausetitle">
    <h2 id="pausetitle">Paused</h2>
    <p id="pausename"></p>
    <button id="resume" type="button" class="gold">Resume</button>
    <div class="pausemenu">
      <button type="button" data-open="bag"><i class="ic ic-bag"></i>Bag</button>
      <button type="button" data-open="journal"><i class="ic ic-journal"></i>Journal</button>
      <button type="button" data-open="map"><i class="ic ic-map"></i>Map</button>
      <button type="button" data-open="graphics"><i class="ic ic-gear"></i>Settings</button>
      <button type="button" id="creative">Creative mode: off</button>
    </div>
    <p class="note">Click anywhere to resume</p>
  </div>
</div>

<div id="heaven"><div class="dialogue">
  <div class="nameplate" id="hname"></div>
  <div id="hlog"></div>
  <div id="htopics"></div>
  <button id="hdescend" class="gold">I'm ready. Send me to the world</button>
</div></div>
<div id="fade"></div>
<div id="card"></div>

<div id="hudroot">
  <div id="water"></div>
  <div id="hurt"></div>
  <div id="cross"></div>
  <div id="hud"></div>
  <div id="compass">
    <div id="compasstape"></div>
    <div id="compassnote"></div>
  </div>
  <div id="realm"></div>
  <div id="toast"></div>
  <div id="prompt"></div>
  <div id="minebar"><div class="track"><div id="minefill"></div></div><span id="minetext"></span></div>
  <button id="maptoggle" type="button" aria-label="Open world map">
    <span class="minimap-face"><canvas id="minimap"></canvas><span class="minimap-north">N</span><kbd id="keymap">M</kbd></span>
    <span id="mapplace"></span><small id="maprealm"></small>
  </button>
  <nav id="shortcuts" aria-label="Menus">
    <i id="dayicon" class="ic ic-sun" title="Time of day"></i>
    <button type="button" data-open="bag" aria-label="Bag"><i class="ic ic-bag"></i><kbd id="keybag">I</kbd></button>
    <button type="button" data-open="journal" aria-label="Journal"><i class="ic ic-journal"></i><kbd id="keyjournal">J</kbd></button>
  </nav>
  <aside id="story">
    <h3 id="wname">…</h3>
    <div class="quest" id="quest"></div>
    <div class="quest" id="guildq"></div>
    <div class="lawline" id="lawline"></div>
  </aside>
  <div id="status"></div>
  <div id="dock">
    <div id="blockname"></div>
    <div id="dockbody">
      <div id="bars">
        <div class="bar" id="hpbar"><i class="ic ic-heart"></i><div class="track"><div id="hpfill"></div></div><span id="hptext"></span></div>
        <div class="bar" id="mpbar"><i class="ic ic-mana"></i><div class="track"><div id="mpfill"></div></div><span id="mptext"></span></div>
        <div id="purse"></div>
      </div>
      <div class="dockrow">
        <div class="dockset" id="hotbar"></div>
        <div class="dockset" id="spells"></div>
      </div>
    </div>
  </div>
</div>

<div id="cursorstack"></div>
<div id="bagtip"></div>

<div id="scrim">
  <div id="book" class="book" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="paneltitle">
    <nav id="tabs" aria-label="Book sections">
      <button type="button" data-page="bag" title="Bag (I)" aria-label="Bag"><i class="ic ic-bag"></i></button>
      <button type="button" data-page="journal" title="Journal (J)" aria-label="Journal"><i class="ic ic-journal"></i></button>
      <button type="button" data-page="map" title="Map (M)" aria-label="Map"><i class="ic ic-map"></i></button>
      <button type="button" data-page="graphics" title="Settings (O)" aria-label="Settings"><i class="ic ic-gear"></i></button>
    </nav>
    <div class="spread">
      <section class="page left">
        <h2 id="paneltitle"></h2>
        <div id="panelline"></div>
        <div id="chat"><div id="chatlog"></div><div id="chattopics"></div></div>
        <div id="pageleft" class="pagebody"></div>
      </section>
      <section class="page right"><div id="pageright" class="pagebody"></div></section>
      <i class="clasp"></i>
    </div>
    <div id="bag">
      <div class="bag-panel">
        <div class="bag-top">
          <div class="gear" id="gear"></div>
          <div class="hero-pane"><canvas id="herocanvas" width="96" height="120" aria-label="Your character"></canvas></div>
          <div class="bag-mid"><div id="bagoff"></div><div id="bagspells"></div></div>
          <div class="bag-right"><div id="bagwork"></div><div class="bag-foot"><div id="bagline"></div><button type="button" id="bagsort" class="slatebutton">Sort</button></div></div>
        </div>
        <div id="bagitems"></div>
        <div class="groove"></div>
        <div id="baghot"></div>
      </div>
      <aside id="bagside"><nav id="sidetabs"></nav><div id="sidebody"></div></aside>
    </div>
    <div id="mapview">
      <div id="mappane">
        <canvas id="worldcanvas" aria-label="Map of the world"></canvas>
        <div id="mapmarks"></div>
        <div id="mapnote"><h3 id="mapname"></h3><p id="mapwhere"></p><p id="mapgoal"></p><div id="mapquests"></div></div>
        <div id="mapreadout"></div>
        <div id="maptools">
          <button type="button" id="mapall" title="Whole world" aria-label="Show the whole world"><i class="ic ic-map"></i></button>
          <button type="button" id="mapfind" title="Find me" aria-label="Find me"><i class="ic ic-you"></i></button>
          <button type="button" id="mapzoomout" title="Zoom out (-)" aria-label="Zoom out">-</button>
          <button type="button" id="mapzoomin" title="Zoom in (+)" aria-label="Zoom in">+</button>
        </div>
      </div>
    </div>
    <nav id="ribbons" aria-label="Journal pages">
      <button type="button" data-page="journal" class="ribbon-red" title="Story and quests" aria-label="Story and quests"><i class="ic ic-quest"></i></button>
      <button type="button" data-page="laws" class="ribbon-blue" title="Laws (L)" aria-label="Laws"><i class="ic ic-scales"></i></button>
      <button type="button" data-page="powers" class="ribbon-amber" title="Powers" aria-label="Powers"><i class="ic ic-bluestar"></i></button>
      <button type="button" data-page="bestiary" class="ribbon-red" title="Creatures" aria-label="Creatures"><i class="ic ic-skull"></i></button>
    </nav>
    <button id="panelclose" type="button" title="Close (Esc)" aria-label="Close"></button>
  </div>
</div>

<script type="importmap">{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
